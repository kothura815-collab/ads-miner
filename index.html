<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fruit Frenzy Mini App</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    :root { --bg: #fdf2f4; --card: #ffffff; --primary: #e11d48; --text: #1e293b; --sub: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; user-select: none; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 70px; }
    .container { width: 100%; max-width: 480px; padding: 14px; }
    .header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px 16px; border-radius: 12px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .coin-box { font-weight: 800; color: #b45309; font-size: 15px; }
    .spin-box { font-weight: 800; color: #0284c7; font-size: 15px; }
    .section-title { font-size: 16px; font-weight: 800; margin: 12px 0 8px; color: var(--text); }
    .task-card { background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    .task-info h4 { font-size: 13px; font-weight: 700; }
    .task-info p { font-size: 11px; color: var(--sub); margin-top: 2px; }
    .btn { padding: 6px 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; }
    .btn-green { background: #16a34a; color: #fff; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 9999; }
    .modal-box { background: #fff; border-radius: 14px; padding: 20px; width: 85%; max-width: 300px; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Header -->
    <div class="header">
      <div class="coin-box">🟡 <span id="coinBalance">115</span> Coins</div>
      <div class="spin-box">⚡ <span id="spinBalance">7</span> Spins</div>
    </div>

    <div class="section-title">⭐ Tasks & Watch Ads</div>

    <!-- Task List (Real Working Ads) -->
    <div class="task-list">
      <div class="task-card">
        <div class="task-info">
          <h4>Watch Video 1x</h4>
          <p>+1 Free Spin & Reward</p>
        </div>
        <button class="btn btn-green" onclick="watchAdTask(1)">GO</button>
      </div>

      <div class="task-card">
        <div class="task-info">
          <h4>Watch Video 2x</h4>
          <p>+1 Free Spin & Reward</p>
        </div>
        <button class="btn btn-green" onclick="watchAdTask(2)">GO</button>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <div style="font-size:16px;font-weight:bold;margin-bottom:8px;" id="mTitle">Alert</div>
      <div style="font-size:13px;color:var(--sub);margin-bottom:16px;" id="mMsg">Message</div>
      <button class="btn btn-green" style="width:100%;" onclick="closeModal()">OK</button>
    </div>
  </div>

  <script>
    const CONFIG = {
      adNetworkUrl: "https://mammothsubway.com/rqibvnk9jb?key=0c97bc9c66375105d41880b754957475",
      reward_id: "50357" // Adsgram Block ID အသစ်
    };

    const tg = window.Telegram?.WebApp;
    if(tg) { tg.expand(); }

    let state = {
      coins: parseInt(localStorage.getItem('coins')) || 115,
      spins: parseInt(localStorage.getItem('spins')) || 7
    };

    function updateUI() {
      document.getElementById('coinBalance').innerText = state.coins;
      document.getElementById('spinBalance').innerText = state.spins;
      localStorage.setItem('coins', state.coins);
      localStorage.setItem('spins', state.spins);
    }

    function showModal(title, msg) {
      document.getElementById('mTitle').innerText = title;
      document.getElementById('mMsg').innerText = msg;
      document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function watchAdTask(taskId) {
      // 1. Ad Network Link ကို ဖွင့်ပေးမည် (Monetag / Adsterra)
      if (tg && tg.openLink) { 
        tg.openLink(CONFIG.adNetworkUrl); 
      } else { 
        window.open(CONFIG.adNetworkUrl, '_blank'); 
      }

      // 2. Adsgram Native Rewarded Ad ကို ခေါ်ယူမည်
      if (window.Adsgram) {
        window.Adsgram.init({ blockId: CONFIG.reward_id }).show()
          .then(() => {
            giveReward();
          })
          .catch((err) => {
            // ကြော်ငြာမတက်လာရင်တောင် User အဆင်ပြေစေရန် Reward ပေးမည်
            giveReward();
          });
      } else {
        setTimeout(() => { giveReward(); }, 2000);
      }
    }

    function giveReward() {
      state.coins += 10;
      state.spins += 1;
      updateUI();
      showModal("Success!", "🎉 +10 Coins နဲ့ +1 Spin ရရှိသွားပါပြီ။");
    }

    updateUI();
  </script>
</body>
</html>
