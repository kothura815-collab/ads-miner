<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ADS MINER - Official Platform</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Adsgram SDK -->
  <script src="https://adsgram.ai/js/adv_adsgram.js" async></script>

  <!-- Multi-Ad Network Scripts -->
  <script type="text/javascript" src="//pl12345678.highcpmgate.com/socialbar.js" async></script>
  <script type="text/javascript" src="//pl87654321.highcpmgate.com/popunder.js" async></script>
  <script src="https://richinfo.co/code/work.js" data-pubid="YOUR_RICHADS_PUB_ID" async></script>

  <style>
    :root { 
      --bg: #0f172a; 
      --card: #1e293b; 
      --primary: #0088cc; 
      --accent: #38bdf8; 
      --text: #f8fafc; 
      --sub: #94a3b8; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; user-select: none; }
    body { 
      background: var(--bg); 
      color: var(--text); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: space-between;
      min-height: 100vh; 
      padding-bottom: 75px; 
    }
    .container { width: 100%; max-width: 420px; padding: 20px; text-align: center; }

    .header-title { font-size: 22px; font-weight: 900; color: var(--accent); margin-bottom: 15px; letter-spacing: 1px; }

    .balance-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .balance-title { font-size: 13px; color: var(--sub); text-transform: uppercase; letter-spacing: 0.5px; }
    .balance-value { font-size: 34px; font-weight: 800; color: #fff; margin-top: 6px; }

    .action-btn {
      width: 100%;
      background: linear-gradient(135deg, #0088cc, #005588);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
      transition: transform 0.1s;
    }
    .action-btn:active { transform: scale(0.98); }

    .ad-banner-box {
      background: rgba(255,255,255,0.02);
      border: 1px dashed var(--accent);
      border-radius: 12px;
      padding: 10px;
      margin-top: 10px;
    }
    .ad-link-btn {
      display: block;
      color: var(--accent);
      font-weight: bold;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.05); z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--sub); text-decoration: none; font-weight: bold; cursor: pointer; }
    .nav-item.active { color: var(--accent); }
    .nav-item span { font-size: 18px; margin-bottom: 2px; }

    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 9999; }
    .modal-box { background: var(--card); border-radius: 16px; padding: 20px; width: 85%; max-width: 320px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
    .input-field { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 12px; box-sizing: border-box; }

    .history-list { max-height: 120px; overflow-y: auto; text-align: left; font-size: 11px; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px; }
    .history-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-title">ADS MINER</div>

    <div class="balance-card">
      <div class="balance-title">Current Balance</div>
      <div class="balance-value"><span id="userBalance">0</span> PTS</div>
      <div style="font-size: 12px; color: var(--sub); margin-top: 4px;">1,000 PTS = $0.01 USDT</div>
    </div>

    <button class="action-btn" id="mineBtn" onclick="triggerMining()">⚡ START MINING (+25 PTS)</button>

    <div class="ad-banner-box">
      <a class="ad-link-btn" onclick="openDirectAdLink()">🌐 Visit Sponsor Ad (+50 PTS)</a>
    </div>
  </div>

  <div class="nav-bar">
    <a class="nav-item active"><span>⚡</span>MINER</a>
    <a class="nav-item" onclick="triggerAdsgramTask()"><span>📋</span>TASKS</a>
    <a class="nav-item" onclick="handleComboAdsForSpins()"><span>🎬</span>FREE BONUS</a>
    <a class="nav-item" onclick="openWithdrawModal()"><span>💰</span>WITHDRAW</a>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <div style="font-size:16px;font-weight:bold;margin-bottom:8px;color:var(--accent);" id="mTitle">Notification</div>
      <div style="font-size:12px;color:var(--sub);margin-bottom:14px;" id="mMsg">Message</div>
      <button style="width:100%;padding:10px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-weight:bold;" onclick="closeModal()">OK</button>
    </div>
  </div>

  <!-- Withdraw Modal -->
  <div class="modal" id="withdrawModal">
    <div class="modal-box">
      <div style="font-size:16px;font-weight:bold;color:var(--accent);margin-bottom:4px;">Withdraw USDT</div>
      <div style="font-size:11px;color:var(--sub);">Keep 1,000 PTS Reserve in Account</div>
      
      <div style="margin:10px 0;background:rgba(255,255,255,0.05);padding:8px;border-radius:8px;font-size:12px;font-weight:bold;">
        Balance: <span id="wCoins">0</span> PTS (~$<span id="wUSD">0.00</span>) | Daily: <span id="dailyLeft">5</span>/5
      </div>

      <input type="text" id="tgUsername" class="input-field" placeholder="@username (Optional)">
      <input type="text" id="walletAddress" class="input-field" placeholder="Enter TON / USDT Wallet Address">
      
      <button style="width:100%;padding:10px;background:#22c55e;color:#fff;border:none;border-radius:8px;font-weight:bold;margin-top:6px;" onclick="processWithdraw()">CONFIRM WITHDRAW</button>
      
      <div style="font-size:12px;font-weight:bold;color:#fff;margin-top:10px;text-align:left;">Withdrawal Records:</div>
      <div class="history-list" id="historyList">
        <div style="color:var(--sub);text-align:center;">No records found.</div>
      </div>

      <button style="width:100%;padding:8px;background:#475569;color:#fff;border:none;border-radius:8px;font-size:11px;margin-top:10px;" onclick="closeWithdrawModal()">CLOSE</button>
    </div>
  </div>

  <script>
    const CONFIG = {
      adsgram: {
        rewarded_id: "51101",
        interstitial_id: "51102",
        task_id: "51103"
      },
      adsterra_link: "https://www.highcpmgate.com/rqibvnk9jb?key=0c97bc9c66375105d41880b754957475"
    };

    const tg = window.Telegram?.WebApp;
    if(tg) { tg.expand(); tg.ready(); }

    let isMining = false;
    let state = {
      coins: parseInt(localStorage.getItem('coins')) || 0,
      dailyWithdraws: parseInt(localStorage.getItem('dailyWithdraws')) || 0,
      lastWithdrawDate: localStorage.getItem('lastWithdrawDate') || "",
      withdrawals: JSON.parse(localStorage.getItem('withdrawals')) || []
    };

    const today = new Date().toLocaleDateString();
    if (state.lastWithdrawDate !== today) {
      state.dailyWithdraws = 0;
      state.lastWithdrawDate = today;
    }

    function updateUI() {
      document.getElementById('userBalance').innerText = state.coins;
      localStorage.setItem('coins', state.coins);
      localStorage.setItem('dailyWithdraws', state.dailyWithdraws);
      localStorage.setItem('lastWithdrawDate', state.lastWithdrawDate);
      localStorage.setItem('withdrawals', JSON.stringify(state.withdrawals));
    }

    function showModal(title, msg) {
      document.getElementById('mTitle').innerText = title;
      document.getElementById('mMsg').innerText = msg;
      document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    /* Mining Mechanic */
    function triggerMining() {
      if (isMining) return;
      isMining = true;
      const btn = document.getElementById('mineBtn');
      btn.innerText = "⏳ MINING IN PROGRESS...";
      btn.disabled = true;

      setTimeout(() => {
        state.coins += 25;
        updateUI();
        btn.innerText = "⚡ START MINING (+25 PTS)";
        btn.disabled = false;
        isMining = false;

        if (Math.random() < 0.3 && window.Adsgram) {
          const AdController = window.Adsgram.init({ blockId: CONFIG.adsgram.interstitial_id, debug: false });
          AdController.show().catch(() => {});
        }
      }, 3000);
    }

    /* Ad Trigger Functions */
    function triggerAdsgramTask() {
      if (window.Adsgram) {
        const AdController = window.Adsgram.init({ blockId: CONFIG.adsgram.task_id, debug: false });
        AdController.show().then((result) => {
          if (result && result.done) {
            state.coins += 100;
            updateUI();
            showModal("Task Success", "+100 Points earned!");
          }
        }).catch(() => { openDirectAdLink(); });
      } else {
        openDirectAdLink();
      }
    }

    function handleComboAdsForSpins() {
      openDirectAdLink();
      setTimeout(() => {
        if (window.Adsgram) {
          const AdController = window.Adsgram.init({ blockId: CONFIG.adsgram.rewarded_id, debug: false });
          AdController.show().then((result) => {
            if (result && result.done) {
              state.coins += 50;
              updateUI();
              showModal("Bonus Granted", "+50 Points added!");
            }
          }).catch(() => {});
        }
      }, 1000);
    }

    function openDirectAdLink() {
      if (tg && tg.openLink) { tg.openLink(CONFIG.adsterra_link); } 
      else { window.open(CONFIG.adsterra_link, '_blank'); }
      state.coins += 50;
      updateUI();
    }

    /* Withdraw Integration */
    function openWithdrawModal() {
      let usdVal = (state.coins / 1000) * 0.01;
      document.getElementById('wCoins').innerText = state.coins;
      document.getElementById('wUSD').innerText = usdVal.toFixed(2);
      document.getElementById('dailyLeft').innerText = 5 - state.dailyWithdraws;
      renderWithdrawHistory();
      document.getElementById('withdrawModal').style.display = 'flex';
    }

    function closeWithdrawModal() { document.getElementById('withdrawModal').style.display = 'none'; }

    async function processWithdraw() {
      let wallet = document.getElementById('walletAddress').value.trim();
      let username = document.getElementById('tgUsername').value.trim() || (tg?.initDataUnsafe?.user?.username ? "@" + tg.initDataUnsafe.user.username : "@User");

      if (state.dailyWithdraws >= 5) {
        alert("Daily Limit Reached! (Max 5 withdrawals per day).");
        return;
      }

      if (state.coins < 2000) {
        alert("Minimum balance required is 2,000 PTS! (1,000 PTS to withdraw + 1,000 PTS mandatory reserve).");
        return;
      }

      if (!wallet || wallet.length < 10) {
        alert("Please enter a valid USDT / TON Wallet Address!");
        return;
      }

      state.coins -= 1000;
      state.dailyWithdraws += 1;

      let record = {
        amount: "$0.01 USDT",
        wallet: wallet.substring(0, 6) + "..." + wallet.slice(-4),
        status: "Pending",
        date: new Date().toLocaleDateString()
      };
      state.withdrawals.unshift(record);
      updateUI();

      try {
        const response = await fetch('/api/withdraw', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: username,
            wallet: wallet,
            amount: 1000
          })
        });

        const resData = await response.json();
        if (resData.success) {
          showModal("Withdrawal Submitted", "Success! Request sent to history channel.");
        } else {
          showModal("Submitted", "Recorded in history. Bot Sync Error: " + resData.error);
        }
      } catch (err) {
        showModal("Submitted", "Request recorded in history.");
      }

      closeWithdrawModal();
    }

    function renderWithdrawHistory() {
      let container = document.getElementById('historyList');
      if (state.withdrawals.length === 0) {
        container.innerHTML = `<div style="color:var(--sub);text-align:center;">No records found.</div>`;
        return;
      }
      container.innerHTML = state.withdrawals.map(w => `
        <div class="history-item">
          <div><b>${w.amount}</b> (${w.wallet})</div>
          <div style="color:${w.status === 'Pending' ? '#eab308' : '#22c55e'};font-weight:bold;">${w.status}</div>
        </div>
      `).join('');
    }

    updateUI();
  </script>
</body>
</html>
