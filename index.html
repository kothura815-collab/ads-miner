<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ads Miner Pro</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Adsgram SDK (Async Load) -->
  <script src="https://sad.adsgram.ai/js/sad.min.js" async></script>

  <!-- LAZY LOADED SOCIAL BAR SCRIPTS -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      let s1 = document.createElement('script');
      s1.src = "https://mammothsubway.com/46/ec/32/46ec32efbfe5ecbef2bb3c462cc4c9ba.js";
      document.body.appendChild(s1);
    });
  </script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --accent-green: #22c55e;
      --warning-color: #f59e0b;
      --danger-color: #ef4444;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 16px;
    }

    .native-banner-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(56, 189, 248, 0.4);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      margin-bottom: 16px;
      min-height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .balance-title { font-size: 12px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; }
    .balance-amount { font-size: 32px; font-weight: bold; color: var(--accent-color); margin: 4px 0; }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-primary { background-color: var(--accent-color); color: #0f172a; }
    .btn-warning { background-color: var(--warning-color); color: #000; }
    .btn-disabled { background-color: #334155; color: #64748b; cursor: not-allowed; }

    .task-list { display: flex; flex-direction: column; gap: 10px; }
    .task-item {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .task-counter {
      font-size: 11px;
      font-weight: bold;
      color: var(--accent-color);
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-box {
      background: #1e293b;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      padding: 20px;
      width: 85%;
      max-width: 360px;
      text-align: center;
    }

    .modal-title { font-size: 16px; font-weight: bold; color: var(--accent-color); margin-bottom: 8px; }
    .modal-msg { font-size: 13px; color: var(--text-main); margin-bottom: 16px; line-height: 1.4; }
    
    .cooldown-text {
      font-size: 12px;
      color: var(--warning-color);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- DASHBOARD BANNER -->
    <div class="native-banner-card" id="topNativeBanner">
      <span style="font-size: 12px; color: var(--text-sub);">[ High eCPM Native Banner ]</span>
    </div>

    <!-- Balance Dashboard -->
    <div class="card">
      <div class="balance-title">Total Balance</div>
      <div class="balance-amount"><span id="userBalance">0.0</span> Ads Point</div>
    </div>

    <!-- VIP Mega Booster (Requires 18/18 total clicks to unlock) -->
    <div class="card" style="text-align: center; border: 1px solid rgba(245, 158, 11, 0.4);">
      <h3 style="margin-bottom: 6px; font-size: 15px; color: var(--warning-color);">VIP Mega Booster</h3>
      <p style="font-size: 11px; color: var(--text-sub); margin-bottom: 10px;">
        Complete all 18 Daily Clicks below to claim VIP Booster (+100 Points).
      </p>
      <button id="vipBtn" class="btn btn-disabled" onclick="claimVipBooster()" disabled>
        <span id="vipBtnText">Complete Daily Tasks First</span>
        <span id="vipTimer"></span>
      </button>
    </div>

    <!-- 4-in-1 High Quality Daily Ads Tasks -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin: 14px 0 8px 0;">
      <h3 style="font-size: 14px;">Daily Ads Tasks</h3>
      <span class="cooldown-text" id="globalCooldownText"></span>
    </div>

    <div class="task-list">
      <div class="task-item">
        <div>
          <h4 style="font-size: 13px;">Adsterra Flow</h4>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span class="task-counter" id="task1Count">0/5</span>
          <button class="btn btn-primary" style="padding: 6px 10px; width: auto; font-size: 12px;" onclick="runSingleTask(1)">Start</button>
        </div>
      </div>

      <div class="task-item">
        <div>
          <h4 style="font-size: 13px;">HilltopAds Flow</h4>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span class="task-counter" id="task2Count">0/5</span>
          <button class="btn btn-primary" style="padding: 6px 10px; width: auto; font-size: 12px;" onclick="runSingleTask(2)">Start</button>
        </div>
      </div>

      <div class="task-item">
        <div>
          <h4 style="font-size: 13px;">RichAds Flow</h4>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span class="task-counter" id="task3Count">0/5</span>
          <button class="btn btn-primary" style="padding: 6px 10px; width: auto; font-size: 12px;" onclick="runSingleTask(3)">Start</button>
        </div>
      </div>

      <div class="task-item">
        <div>
          <h4 style="font-size: 13px;">Adsgram Video</h4>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span class="task-counter" id="task4Count">0/3</span>
          <button class="btn btn-primary" style="padding: 6px 10px; width: auto; font-size: 12px;" onclick="runSingleTask(4)">Start</button>
        </div>
      </div>
    </div>

  </div>

  <!-- MODAL NOTIFICATION -->
  <div class="modal-overlay" id="customModal">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">Verification</div>
      <div class="modal-msg" id="modalMsg">Processing...</div>
      <button class="modal-btn btn btn-primary" id="modalBtn" style="display:none;" onclick="closeModal()">OK</button>
    </div>
  </div>

  <script>
    const CONFIG = {
      adsterra_link: "https://mammothsubway.com/rqibvnk9jb?key=0c97bc9c66375105d41880b754957475",
      hilltop_link: "https://plump-plastic.com/ZjLmfX",
      richads_link: "https://mammothsubway.com/itfyrwwjg?key=217fba5c43a13211147abc040716814d",
      adsgram_block_id: "48592",
      cooldown_seconds: 10, // 10s Fast Cooldown
      vip_reset_hours: 4   // 4 Hours Reset Timer
    };

    // Optimized High eCPM Daily Limits
    const LIMITS = { t1: 5, t2: 5, t3: 5, t4: 3 };

    let state = {
      balance: parseFloat(localStorage.getItem('balance')) || 0,
      t1: parseInt(localStorage.getItem('t1')) || 0,
      t2: parseInt(localStorage.getItem('t2')) || 0,
      t3: parseInt(localStorage.getItem('t3')) || 0,
      t4: parseInt(localStorage.getItem('t4')) || 0,
      nextTaskAllowed: parseInt(localStorage.getItem('nextTaskAllowed')) || 0,
      vipCooldownEnd: parseInt(localStorage.getItem('vipCooldownEnd')) || 0
    };

    function saveState() {
      for (let k in state) localStorage.setItem(k, state[k]);
    }

    function updateUI() {
      document.getElementById('userBalance').innerText = state.balance.toFixed(2);
      document.getElementById('task1Count').innerText = `${state.t1}/${LIMITS.t1}`;
      document.getElementById('task2Count').innerText = `${state.t2}/${LIMITS.t2}`;
      document.getElementById('task3Count').innerText = `${state.t3}/${LIMITS.t3}`;
      document.getElementById('task4Count').innerText = `${state.t4}/${LIMITS.t4}`;

      checkVipAndResetStatus();
    }

    function openAdLink(url) {
      if (window.Telegram?.WebApp?.openLink) {
        window.Telegram.WebApp.openLink(url);
      } else {
        window.open(url, '_blank');
      }
    }

    function checkVipAndResetStatus() {
      const now = Date.now();

      if (state.vipCooldownEnd > 0 && now >= state.vipCooldownEnd) {
        state.t1 = 0; state.t2 = 0; state.t3 = 0; state.t4 = 0;
        state.vipCooldownEnd = 0;
        saveState();
      }

      const allCompleted = (state.t1 >= LIMITS.t1 && state.t2 >= LIMITS.t2 && state.t3 >= LIMITS.t3 && state.t4 >= LIMITS.t4);
      const vipBtn = document.getElementById('vipBtn');
      const vipBtnText = document.getElementById('vipBtnText');

      if (state.vipCooldownEnd > now) {
        vipBtn.className = "btn btn-disabled";
        vipBtn.disabled = true;
        vipBtnText.innerText = "Locked (4-Hour Cooldown Active)";
      } else if (allCompleted) {
        vipBtn.className = "btn btn-warning";
        vipBtn.disabled = false;
        vipBtnText.innerText = "Claim VIP Bonus (+100 Pts)";
      } else {
        vipBtn.className = "btn btn-disabled";
        vipBtn.disabled = true;
        vipBtnText.innerText = "Complete Daily Tasks First";
      }
    }

    function runSingleTask(taskNum) {
      const now = Date.now();
      if (now < state.nextTaskAllowed) {
        const remaining = Math.ceil((state.nextTaskAllowed - now) / 1000);
        showModal("Cooldown Active", `Please wait ${remaining}s before starting next ad.`);
        return;
      }

      if (taskNum === 1 && state.t1 >= LIMITS.t1) return;
      if (taskNum === 2 && state.t2 >= LIMITS.t2) return;
      if (taskNum === 3 && state.t3 >= LIMITS.t3) return;
      if (taskNum === 4 && state.t4 >= LIMITS.t4) return;

      if (taskNum === 1) openAdLink(CONFIG.adsterra_link);
      if (taskNum === 2) openAdLink(CONFIG.hilltop_link);
      if (taskNum === 3) openAdLink(CONFIG.richads_link);

      if (taskNum === 4) {
        if (window.Adsgram) {
          window.Adsgram.init({ blockId: CONFIG.adsgram_block_id }).show()
            .then(() => finishTask(4, 1.0))
            .catch(() => finishTask(4, 0.5));
        } else {
          finishTask(4, 0.5);
        }
        return;
      }

      // 3-second fast verification
      showModal("Processing Ad", "Verifying impression... Please wait 3s.");
      let count = 3;
      const interval = setInterval(() => {
        count--;
        if (count > 0) {
          document.getElementById('modalMsg').innerText = `Verifying impression... Please wait ${count}s.`;
        } else {
          clearInterval(interval);
          closeModal();
          finishTask(taskNum, 0.5);
        }
      }, 1000);
    }

    function finishTask(taskNum, reward) {
      if (taskNum === 1) state.t1++;
      if (taskNum === 2) state.t2++;
      if (taskNum === 3) state.t3++;
      if (taskNum === 4) state.t4++;

      state.balance += reward;
      state.nextTaskAllowed = Date.now() + (CONFIG.cooldown_seconds * 1000);
      saveState();
      updateUI();
    }

    function claimVipBooster() {
      state.balance += 100;
      state.vipCooldownEnd = Date.now() + (CONFIG.vip_reset_hours * 60 * 60 * 1000);
      saveState();
      updateUI();
      showModal("VIP Bonus Claimed", "You received +100 Points! Daily tasks will auto-reset in 4 hours.");
    }

    function showModal(title, text) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMsg').innerText = text;
      document.getElementById('modalBtn').style.display = 'block';
      document.getElementById('customModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('customModal').style.display = 'none';
    }

    setInterval(() => {
      const now = Date.now();
      if (state.nextTaskAllowed > now) {
        const left = Math.ceil((state.nextTaskAllowed - now) / 1000);
        document.getElementById('globalCooldownText').innerText = `Next in: ${left}s`;
      } else {
        document.getElementById('globalCooldownText').innerText = "";
      }

      if (state.vipCooldownEnd > now) {
        const diff = state.vipCooldownEnd - now;
        const h = Math.floor(diff / (1000 * 60 * 60));
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);
        document.getElementById('vipTimer').innerText = ` (${h}h ${m}m ${s}s)`;
      } else {
        document.getElementById('vipTimer').innerText = "";
      }
    }, 1000);

    updateUI();
  </script>
</body>
</html>
